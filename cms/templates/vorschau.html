<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Vorschau</title>

    <style>
        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
        }

        .cms-layout {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .cms-body {
            flex: 1;
            display: flex;
            min-height: 100%;
        }

        .cms-sidebar {
            width: 16rem;
            flex-shrink: 0;
        }

        .cms-main {
            flex: 1;
            min-width: 0;
        }
    </style>
</head>
<body class="min-vh-100 bg-body-tertiary">
<div class="cms-layout">
    <!-- Header -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Seitenverwaltung </span>
        </div>
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Vorschau</span>
        </div>

        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
                <a class="nav-link" href="#">Profil: {{ username }}</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url "cms_logout" %}">Abmelden</a>
            </li>
        </ul>
    </nav>

    <!-- Sidebar + Main -->
    <div class="cms-body">
        <!-- sidebar -->
        <!-- TODO: Views erstellen für jeden Sidebar item -->
        <aside class="cms-sidebar border-end bg-light">
            <div class="p-4">
                <p class="fs-2">Schul CMS</p>
            </div>
            <div class="p-4">
                <ul class="list-group">
                    <li class="list-group-item" aria-current="true">
                        <a class="text-dark" href="{% url "admin_dashboard" %}">Übersicht</a>
                    </li>
                    <li class="list-group-item active">
                        <a class="text-dark" href="{% url "to_seiten_main" %}">Seiten</a>
                    </li>
                    <li class="list-group-item">Medien</li>
                    <li class="list-group-item">Navigation</li>
                    <li class="list-group-item">Funktionen</li>
                    <li class="list-group-item">Layouts</li>
                    <li class="list-group-item">Designs</li>
                    <li class="list-group-item">Benutzer & Rechte</li>
                </ul>
            </div>
        </aside>

        <!-- Main mit Page Vorschau -->
        <main class="cms-main bg-white">
            <iframe
                id="page-preview"
                src="{% url "seiten_vorschau" page.id %}"
                class="w-100 border bg-white"
                style="height: 100%;">
            </iframe>
        </main>

    </div>
</div>

</body>
</html>
